services:
  - type: web
    name: goo-cart
    runtime: node
    plan: free
    # This repo's root builds a Cloudflare Worker (the admin portal) — the API
    # lives in server/, so every command below runs from there.
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: goocart
      # Transactional email via the Gmail REST API over HTTPS (not SMTP —
      # Render blocks outbound SMTP ports, so nodemailer/SMTP hangs on every
      # send even with correct credentials). GMAIL_USER is the sending Gmail
      # address; GMAIL_CLIENT_ID/GMAIL_CLIENT_SECRET identify the OAuth app
      # (Google Cloud Console > APIs & Services > Credentials); the app used
      # to send it. GMAIL_REFRESH_TOKEN is a one-time consent grant for that
      # mailbox (via https://developers.google.com/oauthplayground, scope
      # https://www.googleapis.com/auth/gmail.send). None of these are the
      # account's real password.
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_USER_EMAILS
        sync: false
      - key: VENDOR_USER_EMAILS
        sync: false
      - key: PARTNER_USER_EMAILS
        sync: false
      # Real Bike Taxi/Parcel address search and driving-distance fares
      # (Google Places API + Distance Matrix API). Must be a server-side-only
      # key with no application restriction — the customer app's Android-
      # restricted Maps key cannot make these plain HTTPS calls. Falls back
      # to free Nominatim/haversine estimates if left unset.
      - key: GOOGLE_PLACES_API_KEY
        sync: false
