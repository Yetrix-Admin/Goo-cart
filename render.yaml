services:
  - type: web
    name: goo-cart
    runtime: node
    plan: free
    # This repo's root builds a Cloudflare Worker (the admin portal) — the API
    # lives in server/, so every command below runs from there.
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: goocart
      # Transactional email via Gmail SMTP — GMAIL_USER is the sending Gmail
      # address, GMAIL_APP_PASSWORD is an App Password generated for it at
      # https://myaccount.google.com/apppasswords (requires 2-Step
      # Verification on that account), never the account's real password.
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_USER_EMAILS
        sync: false
      - key: VENDOR_USER_EMAILS
        sync: false
      - key: PARTNER_USER_EMAILS
        sync: false
